<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}} - Advanced C Web Server</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/static/style.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', sans-serif;
            color: #1a1a1a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background: #ffffff !important;
            border-bottom: 1px solid #e5e5e5;
            padding: 1rem 0;
        }

        .navbar-brand {
            color: #1a1a1a !important;
            font-weight: 600;
            font-size: 1.1rem;
            letter-spacing: -0.02em;
        }

        .navbar-brand i {
            color: #666;
        }

        .nav-link {
            color: #666 !important;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .nav-link:hover {
            color: #1a1a1a !important;
        }

        .nav-link i {
            opacity: 0.7;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            padding: 2rem 0;
        }

        .card {
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            box-shadow: none;
            background: #ffffff;
            max-width: 600px;
            margin: 0 auto;
        }

        .card-header {
            background: #ffffff !important;
            border-bottom: 1px solid #e5e5e5;
            padding: 2rem;
            border-radius: 8px 8px 0 0 !important;
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #1a1a1a;
            letter-spacing: -0.02em;
            margin: 0;
        }

        .card-title i {
            color: #dc3545;
            font-size: 1.3rem;
        }

        .card-body {
            padding: 2rem;
            text-align: center;
        }

        .error-icon {
            color: #dc3545;
            font-size: 3rem;
            margin-bottom: 1.5rem;
            opacity: 0.9;
        }

        .card-body h3 {
            font-size: 1.25rem;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 1.5rem;
            letter-spacing: -0.02em;
        }

        .alert {
            background: #fef2f2;
            border: 1px solid #fee2e2;
            border-radius: 6px;
            color: #991b1b;
            padding: 1rem;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .alert i {
            color: #dc2626;
        }

        .btn {
            font-size: 0.95rem;
            font-weight: 500;
            padding: 0.625rem 1.25rem;
            border-radius: 6px;
            border: 1px solid;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: #1a1a1a;
            border-color: #1a1a1a;
            color: #ffffff;
        }

        .btn-primary:hover {
            background: #000000;
            border-color: #000000;
        }

        .btn-secondary {
            background: #ffffff;
            border-color: #e5e5e5;
            color: #666;
        }

        .btn-secondary:hover {
            background: #f8f8f8;
            border-color: #d4d4d4;
            color: #1a1a1a;
        }

        .btn i {
            font-size: 0.875rem;
        }

        .help-text {
            margin-top: 2rem;
            text-align: center;
        }

        .help-text p {
            color: #666;
            font-size: 0.9rem;
            margin: 0;
        }

        .help-text i {
            opacity: 0.7;
        }

        footer {
            background: #f8f8f8 !important;
            border-top: 1px solid #e5e5e5;
            color: #666 !important;
            padding: 1.5rem 0;
            margin-top: auto;
        }

        footer p {
            font-size: 0.9rem;
            margin: 0;
        }

        footer i {
            opacity: 0.7;
        }

        @media (max-width: 768px) {
            .card-header {
                padding: 1.5rem;
            }

            .card-body {
                padding: 1.5rem;
            }

            .card-title {
                font-size: 1.25rem;
            }

            .card-body h3 {
                font-size: 1.1rem;
            }

            .error-icon {
                font-size: 2.5rem;
            }

            .btn {
                width: 100%;
                margin-bottom: 0.5rem;
            }

            .btn-secondary {
                margin-left: 0 !important;
            }
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-light">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-server me-2"></i>
                LibreGrad
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/">
                    <i class="fas fa-home me-1"></i>Home
                </a>
            </div>
        </div>
    </nav>

    <main class="container">
        <div class="row justify-content-center w-100">
            <div class="col-lg-6">
                <div class="card">
                    <div class="card-header">
                        <h1 class="card-title">
                            <i class="fas fa-exclamation-triangle me-2"></i>
                            Error {{error_code}}
                        </h1>
                    </div>
                    <div class="card-body">
                        <div class="error-icon">
                            <i class="fas fa-exclamation-circle"></i>
                        </div>
                        <h3>{{title}}</h3>
                        <div class="alert" role="alert">
                            <i class="fas fa-info-circle me-2"></i>
                            {{message}}
                        </div>
                        <div class="mt-4">
                            <a href="/" class="btn btn-primary">
                                <i class="fas fa-home me-2"></i>
                                Return to Home
                            </a>
                            <button onclick="history.back()" class="btn btn-secondary ms-2">
                                <i class="fas fa-arrow-left me-2"></i>
                                Go Back
                            </button>
                        </div>
                    </div>
                </div>
                <div class="help-text">
                    <p>
                        <i class="fas fa-question-circle me-1"></i>
                        If you believe this is an error, please check the server logs.
                    </p>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container text-center">
            <p>
                <i class="fas fa-code me-2"></i>
                LibreGrad WebServer - High Performance, Low Resource Usage
            </p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/script.js"></script>
</body>

</html>
