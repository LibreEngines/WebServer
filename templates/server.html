<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', sans-serif;
            color: #1a1a1a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background: #ffffff !important;
            border-bottom: 1px solid #e5e5e5;
            padding: 1rem 0;
        }

        .navbar-brand {
            color: #1a1a1a !important;
            font-weight: 600;
            font-size: 1.1rem;
            letter-spacing: -0.02em;
        }

        .navbar-brand i {
            color: #666;
        }

        .nav-link {
            color: #666 !important;
            font-size: 0.95rem;
            font-weight: 500;
            margin-left: 2rem;
            transition: color 0.2s ease;
        }

        .nav-link:hover {
            color: #1a1a1a !important;
        }

        .nav-link i {
            opacity: 0.7;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            padding: 2rem 0;
        }

        .card {
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            box-shadow: none;
            background: #ffffff;
            max-width: 700px;
            margin: 0 auto;
        }

        .card-header {
            background: #ffffff !important;
            border-bottom: 1px solid #e5e5e5;
            padding: 2rem;
            border-radius: 8px 8px 0 0 !important;
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #1a1a1a;
            letter-spacing: -0.02em;
            margin: 0;
        }

        .card-title i {
            color: #666;
            font-size: 1.3rem;
        }

        .card-body {
            padding: 2rem;
        }

        .alert {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 6px;
            color: #166534;
            padding: 1.25rem;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .alert i {
            color: #16a34a;
        }

        h5 {
            font-size: 1rem;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 1rem;
            letter-spacing: -0.01em;
        }

        h5 i {
            color: #666;
            font-size: 0.9rem;
        }

        .list-group {
            border-radius: 6px;
            overflow: hidden;
        }

        .list-group-item {
            background: #ffffff;
            border: 1px solid #e5e5e5;
            border-bottom: none;
            color: #1a1a1a;
            padding: 1rem 1.25rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95rem;
        }

        .list-group-item:last-child {
            border-bottom: 1px solid #e5e5e5;
        }

        .list-group-item:first-child {
            border-top-left-radius: 6px;
            border-top-right-radius: 6px;
        }

        .list-group-item:last-child {
            border-bottom-left-radius: 6px;
            border-bottom-right-radius: 6px;
        }

        .list-group-item span:first-child {
            color: #666;
        }

        .list-group-item i {
            color: #999;
            font-size: 0.875rem;
        }

        .badge {
            padding: 0.375rem 0.75rem;
            font-size: 0.8125rem;
            font-weight: 500;
            border-radius: 4px;
            letter-spacing: 0.01em;
        }

        .bg-primary {
            background: #1a1a1a !important;
            color: #ffffff;
        }

        .bg-secondary {
            background: #666 !important;
            color: #ffffff;
        }

        .bg-info {
            background: #0891b2 !important;
            color: #ffffff;
        }

        .bg-danger {
            background: #dc2626 !important;
            color: #ffffff;
        }

        hr {
            margin: 2rem 0;
            border: none;
            height: 1px;
            background: #e5e5e5;
            opacity: 1;
        }

        .footer-text {
            text-align: center;
            margin-top: 2rem;
        }

        .footer-text p {
            color: #666;
            font-size: 0.9rem;
            margin: 0;
        }

        .footer-text i {
            color: #dc2626;
        }

        @media (max-width: 768px) {
            .card-header {
                padding: 1.5rem;
            }
            
            .card-body {
                padding: 1.5rem;
            }
            
            .card-title {
                font-size: 1.25rem;
            }
            
            .nav-link {
                margin-left: 0;
                padding: 0.5rem 1rem;
            }

            .list-group-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.5rem;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-cube"></i>
                LibreGrad Engines
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">
                            <i class="fas fa-home me-1"></i>Home
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/api/status">
                            <i class="fas fa-info-circle me-1"></i>Status
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/server">
                            <i class="fas fa-server me-1"></i>Server
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container">
        <div class="row justify-content-center w-100">
            <div class="col-lg-8">
                <div class="card">
                    <div class="card-header">
                        <h1 class="card-title">
                            <i class="fas fa-rocket me-2"></i>
                            {{title}}
                        </h1>
                    </div>
                    <div class="card-body">
                        <div class="alert" role="alert">
                            <i class="fas fa-check-circle me-2"></i>
                            {{message}}
                        </div>
                        
                        <div class="row">
                            <div class="col-md-12">
                                <h5><i class="fas fa-info me-2"></i>Server Information</h5>
                                <div class="list-group list-group-flush">
                                    <div class="list-group-item">
                                        <span><i class="fas fa-tag me-2"></i>Version</span>
                                        <span class="badge bg-primary">{{version}}</span>
                                    </div>
                                    <div class="list-group-item">
                                        <span><i class="fas fa-code me-2"></i>Language</span>
                                        <span class="badge bg-secondary">C</span>
                                    </div>
                                    <div class="list-group-item">
                                        <span><i class="fas fa-network-wired me-2"></i>Protocol</span>
                                        <span class="badge bg-info">HTTP/1.1</span>
                                    </div>
                                    <div class="list-group-item">
                                        <span><i class="fas fa-signal me-2"></i>Status</span>
                                        <span class="badge bg-danger">{{status}}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <hr>
                        
                    </div>
                </div>
                
                <div class="footer-text">
                    <p>
                        <i class="fas fa-heart me-1"></i>
                        Built with C and powered by Libregrad
                    </p>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
